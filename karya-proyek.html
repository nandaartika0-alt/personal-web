    <!-- JAVASCRIPT INTERNAL - TOMBOL SUKA -->
    <script>
        function tambahSuka(elemenTombol) {
            // Cek apakah sudah disukai
            if (elemenTombol.classList.contains('liked')) {
                return;
            }
            
            // Tambah kelas liked untuk pemicu CSS animasi
            elemenTombol.classList.add('liked');
            
            // Tambahkan angka 1 pada counter
            let elemenAngka = elemenTombol.querySelector('.count');
            if (elemenAngka) {
                let angkaSekarang = parseInt(elemenAngka.innerText) || 0;
                elemenAngka.innerText = angkaSekarang + 1;
            }

            // Ubah ikon Phosphor jika ada
            let ikon = elemenTombol.querySelector('i');
            if (ikon) {
                ikon.classList.remove('ph');
                ikon.classList.add('ph-fill');
            }
        }
    </script>
