<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Kontak - Portofolio Dwi</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../assets/css/style.css">
  
</head>

<body>
    <header>
        <nav>
            <div class="brand"><i class="ph-fill ph-code"></i> Dwi.Dev</div>
            <ul class="nav-menu">
                <li><a href="../index.html"><i class="ph ph-house-line"></i> Beranda</a></li>
                <li><a href="tentang.html"><i class="ph ph-user-circle"></i> Tentang Saya</a></li>
                <li><a href="jaringan.html"><i class="ph ph-wifi-high"></i> Jaringan</a></li>
                <li><a href="iot-arduino.html"><i class="ph ph-cpu"></i> IoT & Arduino</a></li>
                <li><a href="karya-proyek.html"><i class="ph ph-lightbulb"></i> Galeri Proyek</a></li>
                <li><a href="kontak.html" class="active"><i class="ph ph-paper-plane-tilt"></i> Kontak</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2 class="section-title"><i class="ph-fill ph-mailbox"></i> Hubungi Saya</h2>
        <div class="contact-container">
            <div class="contact-info">
                <div class="info-item">
                    <i class="ph-fill ph-envelope-simple"></i>
                    <div>
                        <h4>Email Sekolah</h4>
                        <p>artenova@sekolah.sch.id</p>
                    </div>
                </div>
                <div class="info-item">
                    <i class="ph-fill ph-map-pin"></i>
                    <div>
                        <h4>Lokasi</h4>
                        <p>Mojokerto, Indonesia</p>
                    </div>
                </div>
            </div>

            <!-- BAGIAN FORM KONTAK (Posisi Kanan/Bawah) -->
            <div class="contact-form">
                <!-- Jangan lupa tambahkan onsubmit="kirimPesan(event)" agar JavaScript-nya jalan -->
                <form onsubmit="kirimPesan(event)">

                    <!-- Input 1: Nama Pengirim -->
                    <div class="form-group">
                        <label for="nama">Nama Pengirim</label>
                        <input type="text" id="nama" class="form-control" placeholder="Nama pengirim..." required>
                    </div>

                    <!-- Input 2: Alamat Email -->
                    <div class="form-group">
                        <label for="email">Alamat Email</label>
                        <input type="email" id="email" class="form-control" placeholder="Email..." required>
                    </div>

                    <!-- Input 3: Kategori Pesan (Dropdown Select) -->
                    <div class="form-group">
                        <label for="kategori">Kategori Pesan</label>
                        <select id="kategori" class="form-control" required>
                            <option value="">-- Pilih Tujuanmu --</option>
                            <option value="pertanyaan">Pertanyaan</option>
                            <option value="kolaborasi">Kolaborasi</option>
                            <option value="saran">Saran</option>
                        </select>
                    </div>

                    <!-- Input 4: Pesan Teks (Textarea) -->
                    <div class="form-group">
                        <label for="pesan">Pesan Teks</label>
                        <textarea id="pesan" class="form-control" rows="4" placeholder="Ketik pesan..."
                            required></textarea>
                    </div>

                    <!-- Tombol Kirim -->
                    <button type="submit" class="btn-cute"
                        style="width: 100%; justify-content: center; margin-top: 10px;">
                        <i class="ph-bold ph-paper-plane-right"></i> Kirim Pesan
                    </button>
                </form>
            </div>
        </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Artenova - Kelas XII Informatika</p>
    </footer>
    <!-- JAVASCRIPT INTERNAL - FORM KONTAK -->
    <script>
        function kirimPesan(event) {
            event.preventDefault(); // Biar halaman gak reload
            
            const form = event.target;
            const tombol = form.querySelector('button[type="submit"]');
            const teksAsli = tombol.innerHTML;
            
            // Efek saat tombol ditekan (Loading)
            tombol.innerHTML = '<i class="ph-bold ph-spinner ph-spin"></i> Mengirim...';
            tombol.disabled = true;
            
            // Respon setelah 1.5 detik
            setTimeout(function() {
                tombol.innerHTML = '<i class="ph-bold ph-check-circle"></i> Pesan Terkirim!';
                tombol.style.backgroundColor = '#48bb78';
                tombol.style.color = '#ffffff';
                
                form.reset(); // Mereset isi form
                
                // Kembalikan ke tombol semula setelah 3 detik
                setTimeout(function() {
                    tombol.innerHTML = teksAsli;
                    tombol.style.backgroundColor = '';
                    tombol.style.color = '';
                    tombol.disabled = false;
                }, 3000);
            }, 1500);
        }
    </script>
</body>
</html>
</body>

</html>
